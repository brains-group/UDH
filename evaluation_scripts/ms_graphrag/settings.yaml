### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

# [UDH] Model endpoints and request concurrency are the only settings changed from `graphrag init`
# (settings.init.yaml is the untouched init output; `diff settings.init.yaml settings.yaml`).
# DeepSeek is reached through deepseek_proxy.py (started by run.sh), which turns thinking off, drops
# temperature, and turns json_schema requests into json_object (DeepSeek rejects json_schema).
concurrent_requests: ${GRAPHRAG_CONCURRENCY} # [UDH] default 25; run.sh sets 1200

completion_models:
  default_completion_model:
    model_provider: openai
    model: ${LLM_MODEL} # [UDH] deepseek-flash (DeepSeek V4.1 Flash)
    api_base: ${GRAPHRAG_LLM_API_BASE} # [UDH] local deepseek_proxy.py -> https://api.deepseek.com
    auth_method: api_key # or azure_managed_identity
    api_key: ${DEEPSEEK_API_KEY} # [UDH]
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: ${EMBEDDING_MODEL} # [UDH] voyageai/voyage-4-nano, served by vLLM (common/env.sh)
    api_base: ${EMBEDDING_BASE_URL} # [UDH]
    auth_method: api_key
    api_key: EMPTY # [UDH] vLLM needs no key
    retry:
      type: exponential_backoff

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]
  # [UDH] input/ holds one file: evaluation_data/<ds>/<ds>_scrambled.txt (copied by run.sh)
  # [UDH] G-Medical / Contract QA: input/ holds the inputs dir's ms_graphrag_input/ files; each file is one document

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, sqlite, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"
  # database_name: "cache.db" # Only used when type is sqlite
    
vector_store:
  type: lancedb
  db_uri: output/lancedb
  vector_size: 2048 # [UDH] voyage-4-nano output size (default 3072 = text-embedding-3-large)

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
